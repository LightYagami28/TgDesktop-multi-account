name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v test_telegram_maker.py
      - run: python -m py_compile telegram_maker_multi.py validation.py source_patch.py

  static-analysis:
    name: Analisi statica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Installa strumenti
        run: |
          set -Eeuo pipefail
          trap 'echo "comando fallito alla riga $LINENO: $BASH_COMMAND" >&2' ERR
          trap 'echo "installazione strumenti terminata"' EXIT
          python -m pip install --quiet --only-binary :all: \
            bandit==1.9.4 mypy==2.4.1 pip-audit==2.10.1 ruff==0.17.6
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Bandit
        run: bandit -q -r .
      - name: Mypy
        # I test usano monkeypatch dinamico (cr.os, cr.time) non tipizzabile in strict.
        run: mypy --strict build_helpers.py command_runner.py source_patch.py telegram_maker_multi.py validation.py
      - name: Pip-audit
        run: pip-audit

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Test con copertura
        run: |
          set -Eeuo pipefail
          trap 'echo "comando fallito alla riga $LINENO: $BASH_COMMAND" >&2' ERR
          trap 'echo "test con copertura terminati"' EXIT
          python -m pip install --quiet --only-binary :all: coverage==7.17.2
          python -m coverage run --source=. --omit=test_*.py -m unittest -v test_telegram_maker.py
          python -m coverage xml -o coverage.xml
      # Il segreto SONAR_TOKEN manca nelle PR da fork e da Dependabot: l'analisi si salta.
      - name: Scansione SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
