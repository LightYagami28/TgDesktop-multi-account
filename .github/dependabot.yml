version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  reviewers:
  - LightYagami28
  commit-message:
    prefix: 'chore(deps):'
    prefix-development: 'chore(deps-dev):'
    include: scope
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  reviewers:
  - LightYagami28
  commit-message:
    prefix: 'chore(docker):'
    include: scope
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 20
  reviewers:
  - LightYagami28
  commit-message:
    prefix: 'ci:'
    include: scope
  groups:
    minori-e-patch:
      update-types:
      - minor
      - patch
